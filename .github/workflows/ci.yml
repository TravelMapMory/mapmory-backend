name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          # Caching is off, not merely unset: the input defaults to true, and
          # with no dependencies there is no go.sum for it to key on, so every
          # run logs a "Restore cache failed" warning and caches nothing.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Docker build
        run: docker build -t mapmory-backend:ci .
