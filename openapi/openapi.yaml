openapi: 3.1.0
info:
  title: MapMory — minimal private-flow draft
  version: 0.0.7
  description: |-
    PROPOSED, pending team review. Version 0.0.7 documents authenticated,
    owner-scoped create/list/get/update trip operations implemented in PostgreSQL
    database mode. The legacy in-memory mode does not implement this full contract.

    The upload lifecycle (registerBatch, completeUpload, getBatch), photo
    listing (listTripPhotos) and photo retrieval (getPhoto) are implemented
    in database mode when a photo bucket is configured. completeUpload
    processes within the request, one image at a time. error_code is one of
    unsupported_type, file_too_large, image_too_large or invalid_image.
    Cursor-based trip pagination remains a proposal. Map, geocoding, sharing,
    deletion and the failed-photo retry route are outside this draft.

    Upload recovery, as implemented:
    - completeUpload is idempotent: a processed or failed photo is returned
      as stored and is never processed twice.
    - A photo left in processing for 10 minutes by an interrupted request
      can be completed again by a later completeUpload.
    - A transient server failure during processing returns the photo to
      pending and 500; the client calls completeUpload again.
    - Upload URLs expire 15 minutes after registration and are not renewed.
      While the URL is valid, the client may PUT again and complete. After it
      expires, completeUpload either succeeds (the bytes arrived) or returns
      409 upload_missing, and the client registers the file again in a new
      batch, which creates a new photo.
    - failed is final for that photo; the image itself is unusable.

    Ordering (backend #45, frontend #25): listTripPhotos uses capture order.
    The remaining #45 rules belong to endpoints not in this draft: recently
    uploaded photos (newest upload first, then id) to GET /api/me/summary,
    and trip date ranges that ignore missing or invalid capture times to the
    trip representation.

    Implemented private trip routes require a Firebase ID token; the backend
    resolves the application-user identity and enforces ownership.

    Open questions:
    - How should batch registration recover from a lost response: an
      Idempotency-Key or client-generated batch ID?
    - Is a persistent uploading state needed, and how is upload start detected?
    - Confirm proposed pagination, photo fields, input limits and error codes
      with the UI. Photo-list ordering follows backend #45 and frontend #25.
  contact:
    name: MapMory team
    url: https://github.com/TravelMapMory
servers:
- url: http://localhost:8080/api
  description: Local development API URL
security:
- firebaseBearer: []
paths:
  /trips:
    get:
      operationId: listTrips
      summary: List the current user’s trips
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
        description: Proposed only; cursor pagination is not implemented by the current trip API.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Proposed only; limit-based trip pagination is not implemented.
      description: 'Implemented in database mode as an unpaginated, owner-scoped list ordered by created_at DESC, id DESC. Empty collections return items: [] and next_cursor: null. The cursor and limit parameters remain proposals.'
      responses:
        '200':
          description: List the current user’s trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '503':
          $ref: '#/components/responses/503'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Trips
    post:
      operationId: createTrip
      summary: Create a private trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrip'
      description: >-
        Implemented in database mode. Ownership comes from the verified identity.
        Title and notes are trimmed, with the same length limits used by PATCH:
        title is required, nonblank and at most 120 Unicode code points; notes
        are optional and at most 2,000 Unicode code points. Explicit null is
        invalid for either field. Initial cover is null and photo_count is zero.
      responses:
        '201':
          description: Create a private trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '503':
          $ref: '#/components/responses/503'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Trips
  /trips/{trip_id}:
    parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getTrip
      summary: Get an owned trip
      responses:
        '200':
          description: Get an owned trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '503':
          $ref: '#/components/responses/503'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Trips
      description: Return an owned trip, including its photo count and optional cover.
        Return 404 if the trip is absent or belongs to another user.
    patch:
      operationId: updateTrip
      summary: Update an owned trip's title or private notes
      description: >-
        Implemented in database mode. Supply at least one field; omitted fields
        are unchanged. Supplied strings are trimmed, and an empty notes string
        clears the notes. The owner is resolved from the verified Firebase identity,
        never from the request body. Missing, malformed, and foreign trip IDs
        return the same 404 response. The legacy in-memory mode does not implement PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrip'
            examples:
              rename:
                summary: Rename without changing notes
                value:
                  title: Japan 2026
              clearNotes:
                summary: Clear notes without changing title
                value:
                  notes: ''
      responses:
        '200':
          description: Updated owned trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '503':
          $ref: '#/components/responses/503'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Trips
  /trips/{trip_id}/photos:
    parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listTripPhotos
      summary: List photos, including unlocated photos
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor from the previous response. An invalid cursor returns
          400.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Maximum number of items to return in this page.
      description: 'Capture order (backend #45, frontend #25): capture_time_local
        oldest first, compared as camera-local wall time without applying
        capture_utc_offset; equal capture times by uploaded_at oldest first, then
        by id. Photos without a usable capture time come after all dated photos,
        and photos that were never uploaded come last within their group. The
        order is total and cursor pages continue it without gaps or duplicates
        for an unchanged collection, so clients need not sort across pages.
        Empty collections return items: [] and next_cursor: null.'
      responses:
        '200':
          description: List photos, including unlocated photos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPage'
              examples:
                mixedStates:
                  $ref: '#/components/examples/PhotoPageMixed'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Photos
  /photos/{photo_id}:
    parameters:
    - name: photo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getPhoto
      summary: Get one owned photo
      description: Return one of the caller's photos with a fresh display_image
        URL when it has one. A photo in another user's trip returns 404, exactly
        like a photo that does not exist.
      responses:
        '200':
          description: Get one owned photo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
              examples:
                ready:
                  $ref: '#/components/examples/PhotoReady'
                needsLocation:
                  $ref: '#/components/examples/PhotoNeedsLocation'
                failed:
                  $ref: '#/components/examples/PhotoFailed'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Photos
  /trips/{trip_id}/batches:
    parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: registerBatch
      summary: Register files and obtain signed upload URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUpload'
      description: JPEG/PNG only, at most 25,000,000 bytes per file (proposed interpretation
        of 25 MB). Unsupported type/size produces a per-file rejection; malformed
        requests or duplicate client_file_id values return 400. Initial limits are
        provisional. Retrying batch creation after a lost response is unresolved;
        do not assume this POST is idempotent. Results are grouped into accepted_files
        and rejected_files; both arrays are present even if empty. The batch may be
        empty when every file is rejected.
      responses:
        '201':
          description: Register files and obtain signed upload URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredBatch'
              examples:
                acceptedAndRejected:
                  $ref: '#/components/examples/RegisteredBatchMixed'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Uploads
  /batches/{batch_id}:
    parameters:
    - name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getBatch
      summary: Get owned batch and per-photo status
      responses:
        '200':
          description: Get owned batch and per-photo status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Uploads
      description: Return the owned batch and its registered photos, including processing
        states and errors. Use this response to restore upload status after a reload;
        rejected files are not registered photo records.
  /batches/{batch_id}/files/{client_file_id}/complete:
    parameters:
    - name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: client_file_id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: completeUpload
      summary: Process an uploaded file and return its photo
      description: 'No request body. Check ownership and object existence, then process
        within this request. A processed photo returns its current record without
        reprocessing. A concurrently processing photo or missing uploaded object returns
        409. Image validation failure returns 200 with state: failed and an error_code,
        because the failure is persisted on the photo. A photo whose processing was
        interrupted for 10 minutes can be completed again; see Upload recovery in
        the API description.'
      responses:
        '200':
          description: Process an uploaded file and return its photo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
              examples:
                ready:
                  $ref: '#/components/examples/PhotoReady'
                needsLocation:
                  $ref: '#/components/examples/PhotoNeedsLocation'
                failed:
                  $ref: '#/components/examples/PhotoFailed'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Uploads
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    '400':
      description: 'Invalid request; error.code: invalid_request.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: 'Missing or invalid Firebase ID token; implemented error.code: unauthorized.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: 'Resource does not exist or is inaccessible to this user; error.code:
        not_found.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: 'Upload state prevents completion; error.code: upload_missing or
        processing_in_progress.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            uploadMissing:
              summary: The file has not reached storage; PUT it, or register it again
                if the upload URL expired
              value:
                error:
                  code: upload_missing
                  message: the file has not been uploaded yet
            processingInProgress:
              summary: Another request is processing this photo; poll getBatch
              value:
                error:
                  code: processing_in_progress
                  message: the photo is already being processed
    '503':
      description: 'Application-user resolution unavailable; error.code: user_resolution_unavailable.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: 'Unexpected server error; error.code: internal_error. Do not expose
        implementation details.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  examples:
    PhotoReady:
      summary: Processed photo with EXIF GPS and capture time
      value:
        id: 0b9c6a7e-2f4d-4c1a-9e8b-1a2b3c4d5e6f
        trip_id: a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b
        batch_id: 6f1e2d3c-4b5a-4968-8776-655443322110
        client_file_id: IMG_0412.jpg-3482114-1751000000000
        state: ready
        error_code: null
        uploaded_at: '2026-11-01T18:20:05Z'
        capture_time_local: '2026-07-14T09:30:00'
        capture_utc_offset: '+09:00'
        exif_lat: 35.0116
        exif_lng: 135.7681
        lat: 35.0116
        lng: 135.7681
        display_image:
          url: https://storage.googleapis.com/mapmory-2026-photos/display/a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b/0b9c6a7e-2f4d-4c1a-9e8b-1a2b3c4d5e6f.jpg?X-Goog-Signature=...
          expires_at: '2026-11-01T19:20:05Z'
    PhotoNeedsLocation:
      summary: Processed photo without EXIF metadata; unknown values are null
      value:
        id: 1c0d7b8f-3a5e-4d2b-8f9c-2b3c4d5e6f70
        trip_id: a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b
        batch_id: 6f1e2d3c-4b5a-4968-8776-655443322110
        client_file_id: screenshot.png-201844-1751000100000
        state: needs-location
        error_code: null
        uploaded_at: '2026-11-01T18:20:07Z'
        capture_time_local: null
        capture_utc_offset: null
        exif_lat: null
        exif_lng: null
        lat: null
        lng: null
        display_image:
          url: https://storage.googleapis.com/mapmory-2026-photos/display/a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b/1c0d7b8f-3a5e-4d2b-8f9c-2b3c4d5e6f70.jpg?X-Goog-Signature=...
          expires_at: '2026-11-01T19:20:07Z'
    PhotoFailed:
      summary: The uploaded bytes are not a usable image; final for this photo
      value:
        id: 2d1e8c90-4b6f-4e3c-9a0d-3c4d5e6f7081
        trip_id: a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b
        batch_id: 6f1e2d3c-4b5a-4968-8776-655443322110
        client_file_id: broken.jpg-1024-1751000200000
        state: failed
        error_code: invalid_image
        uploaded_at: '2026-11-01T18:20:09Z'
        capture_time_local: null
        capture_utc_offset: null
        exif_lat: null
        exif_lng: null
        lat: null
        lng: null
        display_image: null
    PhotoPageMixed:
      summary: One page in capture order; the undated photo and the never-uploaded
        photo come last
      value:
        items:
        - id: 0b9c6a7e-2f4d-4c1a-9e8b-1a2b3c4d5e6f
          trip_id: a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b
          batch_id: 6f1e2d3c-4b5a-4968-8776-655443322110
          client_file_id: IMG_0412.jpg-3482114-1751000000000
          state: ready
          error_code: null
          uploaded_at: '2026-11-01T18:20:05Z'
          capture_time_local: '2026-07-14T09:30:00'
          capture_utc_offset: '+09:00'
          exif_lat: 35.0116
          exif_lng: 135.7681
          lat: 35.0116
          lng: 135.7681
          display_image:
            url: https://storage.googleapis.com/mapmory-2026-photos/display/a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b/0b9c6a7e-2f4d-4c1a-9e8b-1a2b3c4d5e6f.jpg?X-Goog-Signature=...
            expires_at: '2026-11-01T19:20:05Z'
        - id: 1c0d7b8f-3a5e-4d2b-8f9c-2b3c4d5e6f70
          trip_id: a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b
          batch_id: 6f1e2d3c-4b5a-4968-8776-655443322110
          client_file_id: screenshot.png-201844-1751000100000
          state: needs-location
          error_code: null
          uploaded_at: '2026-11-01T18:20:07Z'
          capture_time_local: null
          capture_utc_offset: null
          exif_lat: null
          exif_lng: null
          lat: null
          lng: null
          display_image:
            url: https://storage.googleapis.com/mapmory-2026-photos/display/a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b/1c0d7b8f-3a5e-4d2b-8f9c-2b3c4d5e6f70.jpg?X-Goog-Signature=...
            expires_at: '2026-11-01T19:20:07Z'
        - id: 3e2f9da1-5c70-4f4d-8b1e-4d5e6f708192
          trip_id: a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b
          batch_id: 6f1e2d3c-4b5a-4968-8776-655443322110
          client_file_id: IMG_0413.jpg-2950012-1751000300000
          state: pending
          error_code: null
          uploaded_at: null
          capture_time_local: null
          capture_utc_offset: null
          exif_lat: null
          exif_lng: null
          lat: null
          lng: null
          display_image: null
        next_cursor: eyJpIjoiM2UyZjlkYTEtNWM3MC00ZjRkLThiMWUtNGQ1ZTZmNzA4MTkyIn0
    RegisteredBatchMixed:
      summary: One JPEG accepted, one HEIC rejected for its type
      value:
        batch_id: 6f1e2d3c-4b5a-4968-8776-655443322110
        accepted_files:
        - client_file_id: IMG_0412.jpg-3482114-1751000000000
          photo_id: 0b9c6a7e-2f4d-4c1a-9e8b-1a2b3c4d5e6f
          upload:
            method: PUT
            url: https://storage.googleapis.com/mapmory-2026-photos/originals/a3c1f0e2-5b6d-4e7f-8a9b-0c1d2e3f4a5b/0b9c6a7e-2f4d-4c1a-9e8b-1a2b3c4d5e6f?X-Goog-Signature=...
            headers:
              Content-Type: image/jpeg
              x-goog-content-length-range: 3482114,3482114
            expires_at: '2026-11-01T18:35:00Z'
        rejected_files:
        - client_file_id: IMG_0414.heic-1880331-1751000400000
          error:
            code: unsupported_type
            message: only JPEG and PNG images are supported
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      title: Error
    CreateTrip:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trim surrounding whitespace; reject blank titles.
        notes:
          type: string
          default: ''
          maxLength: 2000
          description: Optional; defaults to an empty string. Trim surrounding whitespace.
      additionalProperties: false
      title: CreateTrip
    UpdateTrip:
      type: object
      minProperties: 1
      maxProperties: 2
      additionalProperties: false
      description: >-
        Partial update. Both fields are optional but at least one must be present.
        Only JSON strings are accepted; null is invalid. String limits are counted
        in Unicode code points after trimming surrounding whitespace.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trim surrounding whitespace; reject blank titles.
        notes:
          type: string
          maxLength: 2000
          description: Trim surrounding whitespace; empty string clears notes.
      title: UpdateTrip
    Trip:
      type: object
      required:
      - id
      - title
      - notes
      - created_at
      - photo_count
      - cover
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        photo_count:
          type: integer
          minimum: 0
        cover:
          $ref: '#/components/schemas/TripCover'
      title: Trip
    DisplayImage:
      type: object
      required:
      - url
      - expires_at
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      description: Temporary owner-only display-image URL, valid for 1 hour. The
        server reuses a URL while at least 30 minutes remain, so refetching the
        photo list, photo or batch always returns one valid for 30 minutes or
        more. No original image URL is returned.
      title: DisplayImage
    Photo:
      type: object
      required:
      - id
      - trip_id
      - batch_id
      - client_file_id
      - state
      - error_code
      - uploaded_at
      - capture_time_local
      - capture_utc_offset
      - exif_lat
      - exif_lng
      - lat
      - lng
      - display_image
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        client_file_id:
          type: string
        state:
          $ref: '#/components/schemas/PhotoState'
        error_code:
          type:
          - string
          - 'null'
        uploaded_at:
          type:
          - string
          - 'null'
          format: date-time
        capture_time_local:
          type:
          - string
          - 'null'
          description: Local camera wall time; no implied UTC offset. Not an RFC 3339
            instant.
          examples:
          - '2025-07-14T09:30:00'
        capture_utc_offset:
          type:
          - string
          - 'null'
          pattern: ^[+-][0-9]{2}:[0-9]{2}$
          examples:
          - +09:00
        exif_lat:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        exif_lng:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        lat:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        lng:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        display_image:
          $ref: '#/components/schemas/NullableDisplayImage'
      description: Owner representation. Both fields in each coordinate pair are set
        together or null together. EXIF coordinates are immutable after import; lat/lng
        are effective coordinates. Unknown metadata is explicitly null.
      title: Photo
    Batch:
      type: object
      required:
      - id
      - trip_id
      - photos
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
      title: Batch
    UploadFile:
      type: object
      required:
      - client_file_id
      - size_bytes
      - content_type
      properties:
        client_file_id:
          type: string
          minLength: 1
          maxLength: 100
        size_bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
      additionalProperties: false
      title: UploadFile
    RegisterUpload:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/UploadFile'
      additionalProperties: false
      title: RegisterUpload
    UploadTarget:
      type: object
      required:
      - method
      - url
      - headers
      - expires_at
      properties:
        method:
          $ref: '#/components/schemas/UploadMethod'
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
      description: Send image bytes directly to this URL using the returned method
        and headers. The browser does not attach its Firebase bearer token to GCS.
        The URL expires 15 minutes after registration (expires_at) and binds the
        content type and exact size; see Upload recovery in the API description.
      title: UploadTarget
    AcceptedFile:
      type: object
      required:
      - client_file_id
      - photo_id
      - upload
      properties:
        client_file_id:
          type: string
        photo_id:
          type: string
          format: uuid
        upload:
          $ref: '#/components/schemas/UploadTarget'
      additionalProperties: false
      title: AcceptedFile
    RejectedFile:
      type: object
      required:
      - client_file_id
      - error
      properties:
        client_file_id:
          type: string
        error:
          $ref: '#/components/schemas/UploadRejectionError'
      additionalProperties: false
      title: RejectedFile
    RegisteredBatch:
      title: RegisteredBatch
      type: object
      description: Each requested client_file_id appears exactly once across accepted_files
        and rejected_files. Both arrays are always present; either may be empty. Only
        accepted files have registered photo records and upload targets.
      required:
      - batch_id
      - accepted_files
      - rejected_files
      properties:
        batch_id:
          type: string
          format: uuid
        accepted_files:
          type: array
          items:
            $ref: '#/components/schemas/AcceptedFile'
        rejected_files:
          type: array
          items:
            $ref: '#/components/schemas/RejectedFile'
      additionalProperties: false
    TripPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        next_cursor:
          type:
          - string
          - 'null'
      title: TripPage
    PhotoPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        next_cursor:
          type:
          - string
          - 'null'
      title: PhotoPage
    TripCover:
      type:
      - object
      - 'null'
      required:
      - photo_id
      - image
      properties:
        photo_id:
          type: string
          format: uuid
        image:
          $ref: '#/components/schemas/DisplayImage'
      title: TripCover
    NullableDisplayImage:
      type:
      - object
      - 'null'
      required:
      - url
      - expires_at
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      title: NullableDisplayImage
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
      title: ErrorDetail
    UploadRejectionError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/UploadRejectionCode'
        message:
          type: string
      title: UploadRejectionError
    PhotoState:
      type: string
      enum:
      - pending
      - uploading
      - processing
      - ready
      - needs-location
      - failed
      description: Provisional state model. ready means a display image and usable
        coordinates; needs-location means a display image without usable coordinates.
        uploading persistence is pending review.
      title: PhotoState
    UploadMethod:
      type: string
      enum:
      - PUT
      title: UploadMethod
    UploadRejectionCode:
      type: string
      enum:
      - unsupported_type
      - file_too_large
      title: UploadRejectionCode
tags:
- name: Trips
  description: Private trips owned by the authenticated user
- name: Photos
  description: Owner photo listings
- name: Uploads
  description: File registration, completion and status
