  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      title: Error
    CreateTrip:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trim surrounding whitespace; reject blank titles.
        notes:
          type: string
          default: ''
          maxLength: 2000
          description: Optional; defaults to an empty string. Trim surrounding whitespace.
      additionalProperties: false
      title: CreateTrip
    UpdateTrip:
      type: object
      minProperties: 1
      maxProperties: 2
      additionalProperties: false
      description: >-
        Partial update. Both fields are optional but at least one must be present.
        Only JSON strings are accepted; null is invalid. String limits are counted
        in Unicode code points after trimming surrounding whitespace.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trim surrounding whitespace; reject blank titles.
        notes:
          type: string
          maxLength: 2000
          description: Trim surrounding whitespace; empty string clears notes.
      title: UpdateTrip
    Trip:
      type: object
      required:
      - id
      - title
      - notes
      - created_at
      - photo_count
      - cover
      - located_count
      - cities
      - countries
      - start_date
      - end_date
      - visibility
      - under_review
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        photo_count:
          type: integer
          minimum: 0
        cover:
          $ref: '#/components/schemas/TripCover'
          description: The first processed photo in capture order; null for a trip
            without processed photos.
        located_count:
          type: integer
          minimum: 0
          description: Processed photos with a position, the ones the map can show.
        cities:
          type: array
          items:
            type: string
          description: Distinct city labels of located photos, in the order first photographed.
        countries:
          type: array
          items:
            type: string
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: First capture date; null when no photo has a capture time.
        end_date:
          type:
          - string
          - 'null'
          format: date
        visibility:
          type: string
          enum:
          - private
          - public
          description: public while the trip has a live public share; trips are
            private until the owner shares them publicly (design doc 4.2).
        under_review:
          type: boolean
          description: True while a public share of the trip has an unresolved report
            and is therefore hidden from the public map.
      description: photo_count and the other aggregates cover processed photos (ready
        or needs-location) only.
      title: Trip
    DisplayImage:
      type: object
      required:
      - url
      - expires_at
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      description: Temporary owner-only display-image URL, valid for 1 hour. The
        server reuses a URL while at least 30 minutes remain, so refetching the
        photo list, photo or batch always returns one valid for 30 minutes or
        more. No original image URL is returned.
      title: DisplayImage
    Photo:
      type: object
      required:
      - id
      - trip_id
      - batch_id
      - client_file_id
      - state
      - error_code
      - uploaded_at
      - capture_time_local
      - capture_utc_offset
      - exif_lat
      - exif_lng
      - lat
      - lng
      - display_image
      - country
      - city
      - place_name
      - label_status
      - label_attribution
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        client_file_id:
          type: string
        state:
          $ref: '#/components/schemas/PhotoState'
        error_code:
          type:
          - string
          - 'null'
        uploaded_at:
          type:
          - string
          - 'null'
          format: date-time
        capture_time_local:
          type:
          - string
          - 'null'
          description: Local camera wall time; no implied UTC offset. Not an RFC 3339
            instant.
          examples:
          - '2025-07-14T09:30:00'
        capture_utc_offset:
          type:
          - string
          - 'null'
          pattern: ^[+-][0-9]{2}:[0-9]{2}$
          examples:
          - +09:00
        exif_lat:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        exif_lng:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        lat:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        lng:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        display_image:
          $ref: '#/components/schemas/NullableDisplayImage'
        country:
          type:
          - string
          - 'null'
          description: Place label for the effective coordinates; null until resolved.
        city:
          type:
          - string
          - 'null'
        place_name:
          type:
          - string
          - 'null'
          description: Most specific named place, such as a venue; optional detail.
        label_status:
          $ref: '#/components/schemas/LabelStatus'
        label_attribution:
          type:
          - string
          - 'null'
          description: Credit the label provider requires next to these labels.
      description: Owner representation. Both fields in each coordinate pair are set
        together or null together. EXIF coordinates are immutable after import; lat/lng
        are effective coordinates. Unknown metadata is explicitly null.
      title: Photo
    Batch:
      type: object
      required:
      - id
      - trip_id
      - photos
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
      title: Batch
    UploadFile:
      type: object
      required:
      - client_file_id
      - size_bytes
      - content_type
      properties:
        client_file_id:
          type: string
          minLength: 1
          maxLength: 100
        size_bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
      additionalProperties: false
      title: UploadFile
    RegisterUpload:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/UploadFile'
      additionalProperties: false
      title: RegisterUpload
    UploadTarget:
      type: object
      required:
      - method
      - url
      - headers
      - expires_at
      properties:
        method:
          $ref: '#/components/schemas/UploadMethod'
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
      description: Send image bytes directly to this URL using the returned method
        and headers. The browser does not attach its Firebase bearer token to GCS.
        The URL expires 15 minutes after registration (expires_at) and binds the
        content type and exact size; see Upload recovery in the API description.
      title: UploadTarget
    AcceptedFile:
      type: object
      required:
      - client_file_id
      - photo_id
      - upload
      properties:
        client_file_id:
          type: string
        photo_id:
          type: string
          format: uuid
        upload:
          $ref: '#/components/schemas/UploadTarget'
      additionalProperties: false
      title: AcceptedFile
    RejectedFile:
      type: object
      required:
      - client_file_id
      - error
      properties:
        client_file_id:
          type: string
        error:
          $ref: '#/components/schemas/UploadRejectionError'
      additionalProperties: false
      title: RejectedFile
    RegisteredBatch:
      title: RegisteredBatch
      type: object
      description: Each requested client_file_id appears exactly once across accepted_files
        and rejected_files. Both arrays are always present; either may be empty. Only
        accepted files have registered photo records and upload targets.
      required:
      - batch_id
      - accepted_files
      - rejected_files
      properties:
        batch_id:
          type: string
          format: uuid
        accepted_files:
          type: array
          items:
            $ref: '#/components/schemas/AcceptedFile'
        rejected_files:
          type: array
          items:
            $ref: '#/components/schemas/RejectedFile'
      additionalProperties: false
    TripPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        next_cursor:
          type:
          - string
          - 'null'
      title: TripPage
    PhotoPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        next_cursor:
          type:
          - string
          - 'null'
      title: PhotoPage
    TripCover:
      type:
      - object
      - 'null'
      required:
      - photo_id
      - image
      properties:
        photo_id:
          type: string
          format: uuid
        image:
          $ref: '#/components/schemas/DisplayImage'
      title: TripCover
    NullableDisplayImage:
      type:
      - object
      - 'null'
      required:
      - url
      - expires_at
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      title: NullableDisplayImage
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
      title: ErrorDetail
    UploadRejectionError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/UploadRejectionCode'
        message:
          type: string
      title: UploadRejectionError
    PhotoState:
      type: string
      enum:
      - pending
      - uploading
      - processing
      - ready
      - needs-location
      - failed
      description: Provisional state model. ready means a display image and usable
        coordinates; needs-location means a display image without usable coordinates.
        uploading persistence is pending review.
      title: PhotoState
    UploadMethod:
      type: string
      enum:
      - PUT
      title: UploadMethod
    UploadRejectionCode:
      type: string
      enum:
      - unsupported_type
      - file_too_large
      title: UploadRejectionCode
    MapPhoto:
      type: object
      required:
      - id
      - trip_id
      - trip_title
      - lat
      - lng
      - display_image
      - capture_time_local
      - city
      - country
      - place_name
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        trip_title:
          type: string
        lat:
          type: number
        lng:
          type: number
        display_image:
          $ref: '#/components/schemas/NullableDisplayImage'
        capture_time_local:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        place_name:
          type:
          - string
          - 'null'
      title: MapPhoto
    MapPhotoPage:
      type: object
      required:
      - items
      - truncated
      properties:
        items:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/MapPhoto'
        truncated:
          type: boolean
      title: MapPhotoPage
    MeSummary:
      type: object
      required:
      - photo_count
      - country_count
      - city_count
      - to_review_count
      - recently_uploaded
      properties:
        photo_count:
          type: integer
          minimum: 0
        country_count:
          type: integer
          minimum: 0
        city_count:
          type: integer
          minimum: 0
        to_review_count:
          type: integer
          minimum: 0
        recently_uploaded:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Photo'
      title: MeSummary
    CreateShare:
      type: object
      additionalProperties: false
      required:
      - mode
      - title
      - photo_ids
      properties:
        mode:
          type: string
          enum:
          - link
          - public
        title:
          type: string
          description: 1 to 120 characters after trimming.
        description:
          type: string
          description: At most 600 characters; blank means none.
        photo_ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
          description: Processed photos of this trip; duplicates are ignored.
      title: CreateShare
    Share:
      type: object
      required:
      - id
      - trip_id
      - mode
      - title
      - description
      - photo_ids
      - token
      - created_at
      - revoked_at
      - under_review
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - link
          - public
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        photo_ids:
          type: array
          items:
            type: string
            format: uuid
        token:
          type: string
          description: 128 random bits. The recipient address is /s/{token} on the
            frontend origin. Only the owner receives it.
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        under_review:
          type: boolean
          description: True while a report on this public share is unresolved. The
            share is then hidden from the public map and its public page; its link
            keeps working.
      title: Share
    ShareList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Share'
      title: ShareList
    SharedPhoto:
      type: object
      required:
      - id
      - display_image
      - capture_time_local
      - city
      - country
      - display_lat
      - display_lng
      properties:
        id:
          type: string
          format: uuid
        display_image:
          $ref: '#/components/schemas/NullableDisplayImage'
        capture_time_local:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        display_lat:
          type:
          - number
          - 'null'
          description: City centre, or the position rounded to 0.01 degrees; never exact.
        display_lng:
          type:
          - number
          - 'null'
      title: SharedPhoto
    SharedCollection:
      type: object
      required:
      - title
      - description
      - created_at
      - photos
      properties:
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        photos:
          type: array
          items:
            $ref: '#/components/schemas/SharedPhoto'
          description: In capture order.
      title: SharedCollection
    PublicShareRef:
      type: object
      required:
      - id
      - title
      - cover_url
      - photo_count
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        cover_url:
          type:
          - string
          - 'null'
        photo_count:
          type: integer
          description: Photos of this share inside the cluster.
      title: PublicShareRef
    PublicCluster:
      type: object
      required:
      - id
      - lat
      - lng
      - count
      - label
      - cover_url
      - bounds
      - share_count
      - shares
      properties:
        id:
          type: string
          examples:
          - 4/131/85
        lat:
          type: number
        lng:
          type: number
        count:
          type: integer
          description: Distinct public photos in the cell.
        label:
          type:
          - string
          - 'null'
          description: Most common city, else most common country.
        cover_url:
          type:
          - string
          - 'null'
        bounds:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: west, south, east, north of the photos' positions.
        share_count:
          type: integer
        shares:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/PublicShareRef'
      title: PublicCluster
    PublicMapPage:
      type: object
      required:
      - clusters
      - truncated
      properties:
        clusters:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PublicCluster'
        truncated:
          type: boolean
      title: PublicMapPage
    LabelStatus:
      type: string
      enum:
      - pending
      - suggested
      - confirmed
      description: Place-label state, independent of the photo state. pending means
        no labels yet (no position, provider unavailable, or a correction whose lookup
        failed); suggested means resolver labels awaiting the owner; confirmed means
        accepted or chosen by the owner.
      title: LabelStatus
    LocationCorrection:
      type: object
      additionalProperties: false
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        selected_place:
          type: object
          additionalProperties: false
          description: Owner-selected search result, not a verified provider identity.
          required: [name, kind]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 160
            kind:
              type: string
              enum: [country, city, locality, street, amenity]
            city:
              type: [string, "null"]
              maxLength: 160
            country:
              type: [string, "null"]
              maxLength: 160
      title: LocationCorrection
    ConfirmLabels:
      type: object
      additionalProperties: false
      required:
      - confirm_label
      properties:
        confirm_label:
          type: boolean
          const: true
      title: ConfirmLabels
    Place:
      type: object
      required:
      - id
      - name
      - label
      - kind
      - lat
      - lng
      - zoom
      - city
      - country
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
          examples:
          - Kyoto, Japan
        kind:
          type: string
          enum:
          - city
          - country
          - locality
          - street
          - amenity
        lat:
          type: number
        lng:
          type: number
        zoom:
          type: integer
          description: Map zoom that frames the place.
        city:
          type:
          - string
          - 'null'
        country:
          type: string
      title: Place
    PlaceSearchResult:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Place'
      title: PlaceSearchResult
tags:
- name: Trips
  description: Private trips owned by the authenticated user
- name: Photos
  description: Owner photo listings
- name: Uploads
  description: File registration, completion and status
- name: Places
  description: World place search
- name: Sharing
  description: Link shares, public shares and the public map
