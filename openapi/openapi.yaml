openapi: 3.1.0
info:
  title: MapMory API
  version: 0.0.12
  description: |-
    Version 0.0.12 documents the
    implemented private trip, photo and sharing APIs, including
    authenticated owner operations, link and public shares,
    the public map, place labels and location correction.

    In PostgreSQL database mode, the backend resolves Firebase identities
    to persistent application-user UUIDs and enforces ownership on private
    resources. The legacy in-memory mode does not implement this full
    contract.

    Photo uploads (registerBatch, completeUpload, getBatch), photo listing
    (listTripPhotos), photo retrieval (getPhoto), location correction
    (updatePhotoLocation), the owner map (listMapPhotos) and Dashboard summary
    (getSummary) are available in database mode when a photo bucket is
    configured. The backend processes each photo within its completeUpload
    request. Processing error_code values include unsupported_type,
    file_too_large, image_too_large and invalid_image.

    Place resolution and correction:
    - Photos retain their original EXIF coordinates separately from their
      effective coordinates, which the owner can correct.
    - Place labels have an independent status: pending, suggested or
      confirmed. A photo can remain ready even when place labels are pending.
    - When a photo has valid coordinates, the place resolver may suggest
      country, city and place labels. Provider information and attribution
      are retained with the labels.
    - The owner can confirm suggested labels or provide new coordinates.
      Successful resolution of corrected coordinates stores confirmed
      labels. If resolution fails, the corrected coordinates are still
      saved and the labels remain pending.
    - Place search (searchPlaces) is public and rate-limited. Without a
      configured geocoding provider, the endpoint returns 503.
    - The owner map returns located photos with optional geographic,
      trip, date and text filters. Dashboard summaries report photo
      counts, distinct places, review counts and recent uploads.

    Upload recovery, as implemented:
    - completeUpload is idempotent: a processed or failed photo is returned
      as stored and is never processed twice.
    - A photo left in processing for 10 minutes by an interrupted request
      can be completed again by a later completeUpload.
    - A transient server failure during processing returns the photo to
      pending and 500; the client calls completeUpload again.
    - Upload URLs expire 15 minutes after registration and are not renewed.
      While the URL is valid, the client may PUT again and complete. After
      it expires, completeUpload either succeeds (the bytes arrived) or
      returns 409 upload_missing, and the client registers the file again
      in a new batch, which creates a new photo.
    - failed is final for that photo; the image itself is unusable.

    Ordering (backend #45, frontend #25):
    - listTripPhotos uses capture order.
    - Recently uploaded photos are ordered by upload time, newest first,
      with the photo ID as a tie-breaker.
    - Trip date ranges ignore missing or invalid capture times.
    - The owner map orders located photos by capture time, newest first,
      and returns at most 2,000 results.

    Sharing:
    - Owners can create and revoke fixed photo selections as link or public shares.
    - Recipients receive selected display images and stored coarse positions,
      not original EXIF positions or private trip metadata.
    - City-centre lookups have a ten-second total budget per share creation;
      unsuccessful lookups fall back to coordinates rounded to 0.01 degrees.
    - Revocation prevents new lookups after it is committed. In-flight
      responses may complete, and previously issued signed image URLs may
      remain accessible until their expiry.
    - The public map clusters at most 20,000 matching share-photo records,
      returning at most 200 clusters. truncated is true if either limit is
      exceeded. When input is capped, counts and rankings reflect only
      the retained records, ordered by share ID and photo ID.

    Photo deletion (deletePhoto, backend #67):
    - The owner can permanently delete one photo; its trip, the trip's other
      photos and its shares stay. Shares stop including the photo at once;
      trip covers, counts, review counts and map results are computed from
      the remaining photos.
    - Deletion is retryable but not atomic: object storage and the database
      cannot change together. The original and display images are removed
      from storage first and the photo record last, so 204 means the record
      and both images are gone. If removing an image fails, 503
      storage_unavailable is returned and the record is kept, but an image
      removed before the failure stays removed: the photo can then show no
      image until the deletion is repeated. Removing an object that is
      already gone succeeds, so repeating the request completes the
      deletion.
    - Processing that was stale when the photo was deleted can still write a
      display image afterwards. It then finds the record gone and removes
      that image itself; if that removal also fails, the image is left
      unreferenced and is only logged.
    - A photo whose upload URL is still valid (registered less than 20
      minutes ago and not processed) or that another request is processing
      returns 409 photo_busy, because its file could otherwise be written
      after the deletion. Processing stuck for 10 minutes no longer blocks it.
    - Display URLs signed before the deletion may keep working until they
      expire, like after a trip deletion or a share revocation.

    Cursor-based trip pagination and the failed-photo retry route remain
    proposals.

    Open questions:
    - How should batch registration recover from a lost response: an
      Idempotency-Key or client-generated batch ID?
    - Is a persistent uploading state needed, and how is upload start
      detected?
    - Confirm proposed pagination, photo fields, input limits and error
      codes with the UI. Photo-list ordering follows backend #45 and
      frontend #25.
  contact:
    name: MapMory team
    url: https://github.com/TravelMapMory
servers:
- url: http://localhost:8080/api
  description: Local development API URL
security:
- firebaseBearer: []
paths:
  /trips:
    get:
      operationId: listTrips
      summary: List the current user’s trips
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
        description: Proposed only; cursor pagination is not implemented by the current trip API.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Proposed only; limit-based trip pagination is not implemented.
      description: 'Implemented in database mode as an unpaginated, owner-scoped list ordered by created_at DESC, id DESC. Empty collections return items: [] and next_cursor: null. The cursor and limit parameters remain proposals.'
      responses:
        '200':
          description: List the current user’s trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '503':
          $ref: '#/components/responses/503'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Trips
    post:
      operationId: createTrip
      summary: Create a private trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrip'
      description: >-
        Implemented in database mode. Ownership comes from the verified identity.
        Title and notes are trimmed, with the same length limits used by PATCH:
        title is required, nonblank and at most 120 Unicode code points; notes
        are optional and at most 2,000 Unicode code points. Explicit null is
        invalid for either field. Initial cover is null and photo_count is zero.
      responses:
        '201':
          description: Create a private trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '503':
          $ref: '#/components/responses/503'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Trips
  /trips/{trip_id}:
    parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getTrip
      summary: Get an owned trip
      responses:
        '200':
          description: Get an owned trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '503':
          $ref: '#/components/responses/503'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Trips
      description: Return an owned trip, including its photo count and optional cover.
        Return 404 if the trip is absent or belongs to another user.
    patch:
      operationId: updateTrip
      summary: Update an owned trip's title or private notes
      description: >-
        Implemented in database mode. Supply at least one field; omitted fields
        are unchanged. Supplied strings are trimmed, and an empty notes string
        clears the notes. The owner is resolved from the verified Firebase identity,
        never from the request body. Missing, malformed, and foreign trip IDs
        return the same 404 response. The legacy in-memory mode does not implement PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrip'
            examples:
              rename:
                summary: Rename without changing notes
                value:
                  title: Japan 2026
              clearNotes:
                summary: Clear notes without changing title
                value:
                  notes: ''
      responses:
        '200':
          description: Updated owned trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '503':
          $ref: '#/components/responses/503'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Trips
    delete:
      operationId: deleteTrip
      summary: Delete a trip and everything in it
      description: 'Owner only (design doc 2.2 use case 6, 3.4). Removes the trip,
        all its photos, upload batches and shares in one transaction, so its share
        links stop working at once, then deletes the original and display images from
        storage. Already-issued signed display URLs expire within an hour. A trip of
        another user returns 404.'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Trips
  /trips/{trip_id}/photos:
    parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listTripPhotos
      summary: List photos, including unlocated photos
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor from the previous response. An invalid cursor returns
          400.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Maximum number of items to return in this page.
      description: 'Capture order (backend #45, frontend #25): capture_time_local
        oldest first, compared as camera-local wall time without applying
        capture_utc_offset; equal capture times by uploaded_at oldest first, then
        by id. Photos without a usable capture time come after all dated photos,
        and photos that were never uploaded come last within their group. The
        order is total and cursor pages continue it without gaps or duplicates
        for an unchanged collection, so clients need not sort across pages.
        Empty collections return items: [] and next_cursor: null.'
      responses:
        '200':
          description: List photos, including unlocated photos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPage'
              examples:
                mixedStates:
                  $ref: '#/components/examples/PhotoPageMixed'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Photos
  /photos/{photo_id}:
    parameters:
    - name: photo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getPhoto
      summary: Get one owned photo
      description: Return one of the caller's photos with a fresh display_image
        URL when it has one. A photo in another user's trip returns 404, exactly
        like a photo that does not exist.
      responses:
        '200':
          description: Get one owned photo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
              examples:
                ready:
                  $ref: '#/components/examples/PhotoReady'
                needsLocation:
                  $ref: '#/components/examples/PhotoNeedsLocation'
                failed:
                  $ref: '#/components/examples/PhotoFailed'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Photos
    delete:
      operationId: deletePhoto
      summary: Permanently delete one photo
      description: 'Owner only (backend #67). Removes the photo''s original and
        display image from storage, then its record; the trip and its other photos
        and shares stay, and shares stop including the photo. A photo of another
        user returns 404, exactly like a photo that does not exist, including one
        already deleted. A photo still uploading (its upload URL may be in use) or
        being processed returns 409 photo_busy; try again in a few minutes. The
        deletion is retryable but not atomic: the images are removed before the
        record, so a storage failure (503 storage_unavailable) keeps the record but
        may already have removed one or both images. Repeating the request
        completes the deletion. Display URLs issued earlier stay valid until they
        expire.'
      responses:
        '204':
          description: Deleted; the record and both stored images are gone
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'The photo may still receive its upload or is being processed;
            error.code: photo_busy.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: photo_busy
                  message: the photo is still uploading or processing; try again in
                    a few minutes
        '500':
          $ref: '#/components/responses/500'
        '503':
          description: 'Temporary failure; repeat the request. error.code
            storage_unavailable means an image could not be removed: the photo record
            is kept, but an image removed before the failure stays removed, so the
            photo may have no image until the deletion completes. auth_unavailable
            and user_resolution_unavailable change nothing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Photos
  /map/photos:
    get:
      operationId: listMapPhotos
      summary: The caller's located photos for the owner map
      description: 'Processed photos with a position, newest capture first, at most
        2,000; truncated is true when more matched (design doc 5.2). The browser clusters
        them. Every filter is optional; an invalid filter returns 400.'
      parameters:
      - name: bbox
        in: query
        schema:
          type: string
        description: west,south,east,north in degrees. West greater than east crosses
          the antimeridian.
        example: 130,30,140,40
      - name: trip_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: First capture date, inclusive.
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Last capture date, inclusive.
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: Matches place name, city, country or trip title, case-insensitively.
      responses:
        '200':
          description: Map markers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapPhotoPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Photos
  /me:
    delete:
      operationId: deleteAccount
      summary: Delete the caller's MapMory account data
      description: 'Removes every trip of the caller as deleteTrip does, then the
        application-user record (design doc 3.6). The Firebase sign-in identity is
        deleted by the client afterwards; signing in again with it starts a new,
        empty account.'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Trips
  /me/summary:
    get:
      operationId: getSummary
      summary: Dashboard totals and recent uploads
      description: Counts cover the caller's processed photos. Countries and cities
        count distinct labels of located photos. to_review_count is photos needing
        a location plus suggested labels not yet confirmed. recently_uploaded holds
        the 8 newest uploads, newest first.
      responses:
        '200':
          description: The caller's summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSummary'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Photos
  /photos/{photo_id}/location:
    parameters:
    - name: photo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updatePhotoLocation
      summary: Correct a photo's location or confirm its suggested place
      description: 'Owner only (backend #43, design doc 4.1). With lat and lng, the
        position becomes the effective lat/lng of a ready or needs-location photo,
        which becomes ready; exif_lat/exif_lng and the capture time never change.
        Labels for the new position are resolved and stored as confirmed; if the
        provider is unavailable the position is still saved and labels stay pending.
        Optional selected_place records the owner's explicit selection from place
        search, preserving its name and administrative labels even when reverse
        geocoding returns a nearby venue. Such fields are owner-supplied, not
        independently provider-verified. Coordinate-only updates are unchanged.
        With confirm_label: true, suggested labels become confirmed. A photo of
        another user returns 404. A photo still uploading or processing, or a confirm
        without suggested labels, returns 409.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/LocationCorrection'
              - $ref: '#/components/schemas/ConfirmLabels'
      responses:
        '200':
          description: The updated photo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'Photo state refuses the change; error.code: photo_not_processed
            or no_suggested_labels.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Photos
  /places/search:
    get:
      operationId: searchPlaces
      summary: Find cities, neighbourhoods, streets and named places
      description: 'Public and rate-limited across all callers (design doc 5.2). Used
        by Find a place and the location-correction dialog. No match returns items:
        []; a provider failure or a server without a geocoding key returns 503
        places_unavailable, never an empty list.'
      security: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 100
        description: Place name; trimmed, 2 to 100 characters.
      responses:
        '200':
          description: Matching named places, best first, at most 8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSearchResult'
        '400':
          $ref: '#/components/responses/400'
        '429':
          description: 'Too many searches; retry after Retry-After seconds. error.code:
            rate_limited.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'Place search unavailable; error.code: places_unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Places
  /trips/{trip_id}/shares:
    parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listShares
      summary: The trip's live shares, newest first
      responses:
        '200':
          description: Unrevoked shares of the caller's trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareList'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Sharing
    post:
      operationId: createShare
      summary: Share selected photos by link or publicly
      description: 'A share is a fixed selection of processed photos of this trip;
        adding photos to the trip never changes it (design doc 4.2). Each photo''s
        recipient position is fixed now: its city''s centre when the city is known
        and the geocoder finds it, otherwise its position rounded to 0.01 degrees.
        Recipients never receive exact coordinates. The response carries the link
        token, which only the owner receives.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShare'
      responses:
        '201':
          description: The new share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Sharing
  /shares/{share_id}:
    parameters:
    - name: share_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: revokeShare
      summary: Revoke a link or unpublish a public share
      description: >-
        Revokes a share without deleting its photos. New lookups after
        revocation are rejected and live public-map queries exclude it.
        In-flight responses may complete and previously issued signed image
        URLs remain valid until their own expiration. Repeated revocation
        by the owner succeeds.
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - Sharing
  /shares/{share_id}/report:
    parameters:
    - name: share_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: reportShare
      summary: Report a public share
      description: 'No account needed, rate-limited (design doc 3.5). Only a live
        public share can be reported. A share with an unresolved report is hidden
        from the public map and its public page until the team reviews it; the
        owner''s link keeps working.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  description: 1 to 500 characters after trimming.
      responses:
        '204':
          description: Reported
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '429':
          description: 'Too many reports; error.code: rate_limited.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Sharing
  /s/{token}:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 22
    get:
      operationId: getSharedCollection
      summary: What anyone holding the link sees
      description: No account needed. Only the selected photos, at coarse positions,
        with display images; never the trip, its notes, other photos, exact coordinates
        or EXIF. Responses are not cacheable.
      security: []
      responses:
        '200':
          description: The shared collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedCollection'
        '404':
          $ref: '#/components/responses/404'
        '410':
          description: 'The owner revoked the link; error.code: share_revoked.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Sharing
  /public/shares/{share_id}:
    parameters:
    - name: share_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getPublicShare
      summary: A live public share
      security: []
      responses:
        '200':
          description: The public collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedCollection'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Sharing
  /public/map:
    get:
      operationId: getPublicMap
      summary: Clusters of public photos in the visible area
      description: >-
        No account needed; rate-limited and non-cacheable. Active public
        share-photo records inside bbox are grouped into 64 px Web Mercator
        cells at zoom. Up to 20,000 matching records are clustered and the
        200 largest clusters returned. truncated is true when more input
        records or clusters were omitted. If input was capped, counts and
        rankings reflect only the retained, share-ID/photo-ID-ordered records,
        not necessarily the globally fullest clusters. Positions are the
        stored coarse shared positions.
      security: []
      parameters:
      - name: bbox
        in: query
        required: true
        schema:
          type: string
        description: west,south,east,north; west greater than east crosses the antimeridian.
      - name: zoom
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 22
      responses:
        '200':
          description: Public clusters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMapPage'
        '400':
          $ref: '#/components/responses/400'
        '429':
          description: 'Too many requests; error.code: rate_limited.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Sharing
  /trips/{trip_id}/batches:
    parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: registerBatch
      summary: Register files and obtain signed upload URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUpload'
      description: JPEG/PNG only, at most 25,000,000 bytes per file (proposed interpretation
        of 25 MB). Unsupported type/size produces a per-file rejection; malformed
        requests or duplicate client_file_id values return 400. Initial limits are
        provisional. Retrying batch creation after a lost response is unresolved;
        do not assume this POST is idempotent. Results are grouped into accepted_files
        and rejected_files; both arrays are present even if empty. The batch may be
        empty when every file is rejected.
      responses:
        '201':
          description: Register files and obtain signed upload URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredBatch'
              examples:
                acceptedAndRejected:
                  $ref: '#/components/examples/RegisteredBatchMixed'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Uploads
  /batches/{batch_id}:
    parameters:
    - name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getBatch
      summary: Get owned batch and per-photo status
      responses:
        '200':
          description: Get owned batch and per-photo status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Uploads
      description: Return the owned batch and its registered photos, including processing
        states and errors. Use this response to restore upload status after a reload;
        rejected files are not registered photo records.
  /batches/{batch_id}/files/{client_file_id}/complete:
    parameters:
    - name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: client_file_id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: completeUpload
      summary: Process an uploaded file and return its photo
      description: 'No request body. Check ownership and object existence, then process
        within this request. A processed photo returns its current record without
        reprocessing. A concurrently processing photo or missing uploaded object returns
        409. Image validation failure returns 200 with state: failed and an error_code,
        because the failure is persisted on the photo. A photo whose processing was
        interrupted for 10 minutes can be completed again; see Upload recovery in
        the API description.'
      responses:
        '200':
          description: Process an uploaded file and return its photo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
              examples:
                ready:
                  $ref: '#/components/examples/PhotoReady'
                needsLocation:
                  $ref: '#/components/examples/PhotoNeedsLocation'
                failed:
                  $ref: '#/components/examples/PhotoFailed'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Uploads
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    '400':
      description: 'Invalid request; error.code: invalid_request.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: 'Missing or invalid Firebase ID token; implemented error.code: unauthorized.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: 'Resource does not exist or is inaccessible to this user; error.code:
        not_found.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: 'Upload state prevents completion; error.code: upload_missing or
        processing_in_progress.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            uploadMissing:
              summary: The file has not reached storage; PUT it, or register it again
                if the upload URL expired
              value:
                error:
                  code: upload_missing
                  message: the file has not been uploaded yet
            processingInProgress:
              summary: Another request is processing this photo; poll getBatch
              value:
                error:
                  code: processing_in_progress
                  message: the photo is already being processed
    '503':
      description: 'A temporary server-side failure, never a credential problem: error.code
        auth_unavailable (Firebase signing keys unreachable; Retry-After is set) or
        user_resolution_unavailable. Clients must not sign the user out on a 503; only
        a 401 warrants a token refresh or a new sign-in.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: 'Unexpected server error; error.code: internal_error. Do not expose
        implementation details.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
